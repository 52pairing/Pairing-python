# AI 서버만 띄운다. PostgreSQL 과 Redis 는 백엔드 레포의 docker-compose 를 쓴다.
# (같은 DB 를 공유하므로 여기서 또 띄우면 데이터가 갈린다)
services:
  ai-server:
    build: .
    container_name: pairing-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너에서 호스트의 PostgreSQL/스프링을 볼 때
      AI_DB_URL: postgresql+asyncpg://pairing:pairing@host.docker.internal:5432/pairing
      SPRING_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
