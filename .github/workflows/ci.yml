name: CI

# PR 에서만 린트·테스트를 돌린다.
# develop / main push 는 deploy.yml 이 받아서 테스트까지 같이 돌리므로 여기서 중복 실행하지 않는다.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 새 커밋이 올라오면 이전 실행을 취소한다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 런타임 이미지(Dockerfile)와 같은 3.12 로 맞춘다.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # 계약 테스트는 tests/conftest.py 가 더미 환경변수를 주입하므로
      # PostgreSQL·Gemini 키가 없어도 통과한다.
      - name: Pytest
        run: pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.xml
          retention-days: 7
          if-no-files-found: ignore
