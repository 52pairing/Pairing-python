name: CI

# PR 에서만 린트·테스트를 돌린다.
# develop / main push 는 deploy.yml 이 받아서 테스트까지 같이 돌리므로 여기서 중복 실행하지 않는다.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 새 커밋이 올라오면 이전 실행을 취소한다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 임베딩 검색 SQL 은 raw text() 라서 파이썬 단위 테스트로는 의미를 검증할 수 없다
    # (문자열을 grep 하는 테스트는 소스에 적힌 글자를 소스에서 찾는 동어반복이다).
    # 실제 pgvector 를 띄워서 쿼리를 돌려야만 오타·문법·조인 오류가 잡힌다.
    # 이 서비스가 없으면 해당 테스트는 skip 되고 나머지는 그대로 통과한다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # 런타임 이미지(Dockerfile)와 같은 3.12 로 맞춘다.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # 계약 테스트는 tests/conftest.py 가 더미 환경변수를 주입하므로 Gemini 키가 없어도 통과한다.
      # AI_TEST_DB_URL 은 위 services 의 pgvector 를 가리킨다 — 이게 있어야
      # test_search_scored_candidates_against_real_db 가 skip 되지 않고 실제로 돈다.
      - name: Pytest
        env:
          AI_TEST_DB_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
        run: pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.xml
          retention-days: 7
          if-no-files-found: ignore
