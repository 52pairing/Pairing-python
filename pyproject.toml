[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairing-ai"
version = "0.1.0"
description = "페어링 AI 서버 (Spring Boot 백엔드의 내부 서비스)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # DB: 같은 PostgreSQL 에 pgvector 로 접근한다
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    # 외부 호출
    "httpx>=0.27",
    "tenacity>=9.0",
    "google-genai>=0.3",
    # 성능 메트릭. 모니터링 서버의 Prometheus 가 /metrics 를 긁어간다.
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

# 패키징 대상은 app 하나다. db/ 는 SQL 초기화 스크립트라 파이썬 패키지가 아니다.
# 명시하지 않으면 setuptools 가 flat-layout 자동 탐색에서 app 과 db 를 둘 다 발견하고
# "Multiple top-level packages discovered" 로 설치를 거부한다.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
